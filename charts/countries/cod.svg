<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc"><title id="title">Democratic Republic of the Congo — AI economy snapshot</title><desc id="desc">Six selected measures across jobs, access and infrastructure. Missing values are not zero. Periods and sources vary.</desc><rect width="1080" height="1350" fill="#f6f3eb"/><rect width="14" height="1350" fill="#b5472f"/><text x="64" y="65" font-size="22" fill="#232922" font-weight="700" font-family="Arial, sans-serif">INFERENCEAFRICA</text><text x="64" y="103" font-size="17" fill="#596356" font-weight="400" font-family="Arial, sans-serif">COUNTRY SNAPSHOT  /  COD</text><text x="60" y="176" font-size="54" fill="#232922" font-weight="400" font-family="Georgia, serif">Democratic Republic of the</text><text x="60" y="232" font-size="54" fill="#232922" font-weight="400" font-family="Georgia, serif">Congo</text><text x="64" y="268" font-size="22" fill="#232922" font-weight="400" font-family="Arial, sans-serif">Selected evidence on AI, work and the conditions for access.</text><text x="64" y="304" font-size="18" fill="#596356" font-weight="400" font-family="Arial, sans-serif">6 of 6 measures available  ·  Compiled 2026-10-07</text><line x1="64" y1="346" x2="1016" y2="346" stroke="#bbc1b3"/><text x="64" y="380" font-size="18" fill="#9a3c28" font-weight="700" font-family="Arial, sans-serif">01  JOBS</text><text x="64" y="420" font-size="21" fill="#232922" font-weight="700" font-family="Arial, sans-serif">Task exposure</text><text x="64" y="474" font-size="48" fill="#232922" font-weight="400" font-family="Georgia, serif">10.8</text><text x="64" y="504" font-size="17" fill="#596356" font-weight="400" font-family="Arial, sans-serif">%  ·  2026 study</text><text x="64" y="533" font-size="17" fill="#596356" font-weight="400" font-family="Arial, sans-serif">Modelled task share; not job losses.</text><text x="556" y="420" font-size="21" fill="#232922" font-weight="700" font-family="Arial, sans-serif">Employment-weighted exposure</text><text x="556" y="474" font-size="48" fill="#232922" font-weight="400" font-family="Georgia, serif">0.197</text><text x="556" y="504" font-size="17" fill="#596356" font-weight="400" font-family="Arial, sans-serif">index  ·  2026 study</text><text x="556" y="533" font-size="17" fill="#596356" font-weight="400" font-family="Arial, sans-serif">Modelled index from 0 to 1; not a</text><text x="556" y="555" font-size="17" fill="#596356" font-weight="400" font-family="Arial, sans-serif">percentage.</text><line x1="64" y1="582" x2="1016" y2="582" stroke="#bbc1b3"/><text x="64" y="616" font-size="18" fill="#9a3c28" font-weight="700" font-family="Arial, sans-serif">02  ACCESS</text><text x="64" y="656" font-size="21" fill="#232922" font-weight="700" font-family="Arial, sans-serif">Mobile data · 5 GB minimum</text><text x="64" y="710" font-size="48" fill="#232922" font-weight="400" font-family="Georgia, serif">10</text><text x="64" y="740" font-size="17" fill="#596356" font-weight="400" font-family="Arial, sans-serif">USD / month  ·  2025</text><text x="64" y="769" font-size="17" fill="#596356" font-weight="400" font-family="Arial, sans-serif">Historical retail basket; excludes device</text><text x="64" y="791" font-size="17" fill="#596356" font-weight="400" font-family="Arial, sans-serif">costs.</text><text x="556" y="656" font-size="21" fill="#232922" font-weight="700" font-family="Arial, sans-serif">Estimated generative AI use</text><text x="556" y="710" font-size="48" fill="#232922" font-weight="400" font-family="Georgia, serif">7.8</text><text x="556" y="740" font-size="17" fill="#596356" font-weight="400" font-family="Arial, sans-serif">%  ·  H2 2025</text><text x="556" y="769" font-size="17" fill="#596356" font-weight="400" font-family="Arial, sans-serif">Modelled share of working-age population.</text><line x1="64" y1="818" x2="1016" y2="818" stroke="#bbc1b3"/><text x="64" y="852" font-size="18" fill="#9a3c28" font-weight="700" font-family="Arial, sans-serif">03  INFRASTRUCTURE</text><text x="64" y="892" font-size="21" fill="#232922" font-weight="700" font-family="Arial, sans-serif">Data centres listed</text><text x="64" y="946" font-size="48" fill="#232922" font-weight="400" font-family="Georgia, serif">7</text><text x="64" y="976" font-size="17" fill="#596356" font-weight="400" font-family="Arial, sans-serif">listings  ·  2026-10-05</text><text x="64" y="1005" font-size="17" fill="#596356" font-weight="400" font-family="Arial, sans-serif">7 marked operational. Source-reported; not a</text><text x="64" y="1027" font-size="17" fill="#596356" font-weight="400" font-family="Arial, sans-serif">census.</text><text x="556" y="892" font-size="21" fill="#232922" font-weight="700" font-family="Arial, sans-serif">Electricity access</text><text x="556" y="946" font-size="48" fill="#232922" font-weight="400" font-family="Georgia, serif">22.5</text><text x="556" y="976" font-size="17" fill="#596356" font-weight="400" font-family="Arial, sans-serif">% of population  ·  2024</text><text x="556" y="1005" font-size="17" fill="#596356" font-weight="400" font-family="Arial, sans-serif">General enabling context; not AI capacity.</text><line x1="64" y1="1066" x2="1016" y2="1066" stroke="#bbc1b3"/><text x="64" y="1100" font-size="16" fill="#232922" font-weight="700" font-family="Arial, sans-serif">READ THIS SNAPSHOT</text><text x="64" y="1130" font-size="18" fill="#232922" font-weight="400" font-family="Arial, sans-serif">Exposure is not job loss. Different measures have different dates and populations.</text><text x="64" y="1156" font-size="18" fill="#232922" font-weight="400" font-family="Arial, sans-serif">Missing information is not zero. This card is a selection, not a complete country record.</text><a href="https://arxiv.org/abs/2605.17086"><text x="64" y="1190" font-size="16" fill="#465745" font-weight="400" font-family="Arial, sans-serif">1. Global Automation Atlas</text></a><a href="https://arxiv.org/abs/2607.05404"><text x="556" y="1190" font-size="16" fill="#465745" font-weight="400" font-family="Arial, sans-serif">2. Employment exposure register</text></a><a href="https://www.itu.int/en/ITU-D/Statistics/Documents/ICT_Prices/ITU_ICTPriceBaskets_2008-2025.xlsx"><text x="64" y="1217" font-size="16" fill="#465745" font-weight="400" font-family="Arial, sans-serif">3. ITU price baskets</text></a><a href="https://www.microsoft.com/en-us/research/wp-content/uploads/2026/01/Microsoft-AI-Diffusion-Report-January-2026.pdf"><text x="556" y="1217" font-size="16" fill="#465745" font-weight="400" font-family="Arial, sans-serif">4. Microsoft AI Economy Institute</text></a><a href="https://corpus.data-landscapers.io/datasets/data-centres/"><text x="64" y="1244" font-size="16" fill="#465745" font-weight="400" font-family="Arial, sans-serif">5. Data Landscapers · CC BY 4.0</text></a><a href="https://api.worldbank.org/v2/country/COD/indicator/EG.ELC.ACCS.ZS?format=json&amp;mrnev=1&amp;per_page=100"><text x="556" y="1244" font-size="16" fill="#465745" font-weight="400" font-family="Arial, sans-serif">6. World Bank / source agency</text></a><a href="https://inferenceafrica.com/country-dr-congo.html"><text x="64" y="1290" font-size="17" fill="#232922" font-weight="700" font-family="Arial, sans-serif">Full record, definitions and sources → country-dr-congo.html</text></a><text x="64" y="1320" font-size="15" fill="#596356" font-weight="400" font-family="Arial, sans-serif">inferenceafrica.com</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 460" width="820" height="460" role="img" aria-label="0.9% of the capacity named in the register is serving load: 6.4 MW energised against 688.4 MW named across four delivery statuses.">
